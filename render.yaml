# Render Blueprint: the API (web service) + Postgres. In the Render dashboard:
# New > Blueprint > pick this repo. See docs/DEPLOYMENT.md for the full walkthrough.
# The client is deployed separately on Vercel.
services:
  - type: web
    name: punebuzz-api
    runtime: node
    plan: free
    region: singapore # closest Render region to Pune
    rootDir: server
    buildCommand: npm ci
    # Migrations are idempotent and guarded by an advisory lock, so running
    # them on every start is safe (and works on the free plan, which has no
    # pre-deploy command).
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: punebuzz-db
          property: connectionString # internal URL; no SSL needed inside Render
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        sync: false # you enter this: your Vercel URL, e.g. https://punebuzz.vercel.app

databases:
  - name: punebuzz-db
    plan: free
    region: singapore
    databaseName: pune_events
    user: pune
