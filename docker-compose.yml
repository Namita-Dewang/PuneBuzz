services:
  db:
    image: postgres:16
    container_name: pune-events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pune
      POSTGRES_PASSWORD: pune
      POSTGRES_DB: pune_events
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pune -d pune_events"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
